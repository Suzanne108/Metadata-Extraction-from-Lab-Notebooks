name: ISA_updater
version: v2-inference

input_variables:
- draft_isa_metadata
- instruction
- latest_evidence

template: |


  The draft isa metadata that has been created up until now is: {draft_isa_metadata}

  The latest evidence that has been retrieved from the source document that you might want to use is the following: {latest_evidence}

  The instructions from the planner are: {instruction}

  Obligations when updating:
  - Before you add any new object (e.g., Study, Assay, Source, Sample, Process, Protocol, Person, Organization, Publication) or nested item (e.g., factor values, parameter values, material attributes), call get_schema for that specific object type and conform strictly to its required fields, types, and shapes.
  - Normalize values to the exact shapes the schema expects (objects vs arrays, ontology annotations, enums, identifiers).

  Output constraints:
  - Return a non-empty JSON object representing an ISA Investigation; never return an empty `{{}}`.
  - If evidence is insufficient, keep the current draft but ensure it contains at least a minimal schema-compliant skeleton: set `@type` to `Investigation` and include empty arrays for `studies`, `people`, `publications`, `ontologySourceReferences`, and `comments`.