name: sample_specialist
version: v1-inference

input_variables:
  - instruction
  - latest_evidence
  - existing_sources
  - existing_materials
  - existing_samples

template: |
  Instruction: {instruction}
  Latest evidence: {latest_evidence}
  Existing sources (by uid): {existing_sources}
  Existing materials (by uid): {existing_materials}
  Existing samples (by uid): {existing_samples}
